<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DistroMS — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">DistroMS</div>
    <p class="auth-card__subtitle">Distribution & Delivery Tracking</p>
    <div id="loginError" class="auth-error"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="field__input" type="email" id="email" autocomplete="email" required placeholder="Enter your email">
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="field__input" type="password" id="password" autocomplete="current-password" required placeholder="Enter your password">
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
